# Builds the Windows desktop installer and the Android APK, each with the
# server address baked in from the BACKEND_URL secret (e.g.
# http://203.0.113.10:8788). Neither app has a URL field, so a build without
# the secret would be useless and fails fast instead.
#
# Runs on version tags (v1.2.3), which also publish a GitHub Release, and
# on demand from the Actions tab. See docs/deploy.md for the secrets.
name: Build apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-windows:
    name: Desktop (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Require BACKEND_URL secret
        shell: bash
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::error::Set the BACKEND_URL repository secret, e.g. http://203.0.113.10:8788"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: pnpm install --frozen-lockfile

      - name: Build installer
        run: pnpm tauri build
        env:
          # Read at compile time by crates/job-hunter-core/src/backend_url.rs.
          JOB_HUNTER_BACKEND_URL: ${{ secrets.BACKEND_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: job-hunter-windows
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

  android:
    name: Mobile (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    env:
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_DEPLOY_TARGET: ${{ secrets.DEPLOY_SSH_KEY != '' && secrets.DEPLOY_HOST != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Require BACKEND_URL secret
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::error::Set the BACKEND_URL repository secret, e.g. http://203.0.113.10:8788"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test

      - name: Decode release signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Warn about debug signing
        if: env.HAS_SIGNING_KEY != 'true'
        run: echo "::warning::ANDROID_KEYSTORE_BASE64 is not set. This APK is signed with a throwaway debug key, so phones can't install it over a previous build; they must uninstall first. See docs/deploy.md."

      - name: Build APK
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # The build number must increase for Android to accept an update.
          flutter build apk --release \
            --dart-define=BACKEND_URL="$BACKEND_URL" \
            --build-number=${{ github.run_number }}
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/job-hunter-${VERSION}-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: job-hunter-android
          if-no-files-found: error
          path: apps/mobile/dist/*.apk

      # Optional: copy the APK straight to the server's downloads folder, so
      # http://<server>/downloads/android serves it immediately.
      - name: Upload APK to server
        if: env.HAS_DEPLOY_TARGET == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          key="$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          chmod 600 "$key"
          port="${DEPLOY_PORT:-22}"
          dest="${DEPLOY_PATH:-~/job-hunter}/apps/backend/downloads"
          ssh_opts="-i $key -p $port -o StrictHostKeyChecking=accept-new"
          ssh $ssh_opts "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p $dest && rm -f $dest/*.apk"
          scp -i "$key" -P "$port" -o StrictHostKeyChecking=accept-new dist/*.apk "$DEPLOY_USER@$DEPLOY_HOST:$dest/"
          rm -f "$key"

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop-windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
