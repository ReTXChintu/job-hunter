name: job_hunter_mobile
description: "Job Hunter companion app: review discovered jobs and approve or reject applications from your phone. All AI, browser automation and job data stay on the desktop app -- this is a thin, read-mostly review client for the self-hosted relay (see docs/mobile-protocol.md)."
publish_to: 'none'
version: 0.5.1+9

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  go_router: ^18.0.1
  dio: ^5.11.1
  web_socket_channel: ^3.0.3
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  mobile_scanner: ^7.4.2
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1
  flutter_local_notifications: ^22.3.1
  workmanager: ^0.10.10
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

# Launcher icons, generated from the brand logo (`assets/icon/`, made from
# the repo's logo.png). Regenerate with `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/logo.png
  adaptive_icon_background: assets/icon/background.png
  adaptive_icon_foreground: assets/icon/foreground.png
  min_sdk_android: 21
